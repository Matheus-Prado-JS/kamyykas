<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BINGO</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1 class="title">BINGO</h1>
    <button id="enterBtn">Entrar na sala</button>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">

      <h2>Insira seu nome</h2>

      <input type="text" id="nameInput" placeholder="Seu nome..." />

      <div class="roles">
        <label>
          <input type="radio" name="role" value="player" checked />
          Player
        </label>

        <label>
          <input type="radio" name="role" value="admin" />
          Admin
        </label>
      </div>

      <input type="password" id="adminPass" placeholder="Senha de admin" class="hidden"/>

      <button id="joinBtn">Entrar</button>

    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
